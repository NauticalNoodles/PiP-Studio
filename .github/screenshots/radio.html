<!doctype html>
<html><head><meta charset="utf-8"><title>Lo-fi radio</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:#fff}
  body{background:radial-gradient(120% 120% at 20% 10%,#3b2a8a 0%,#1d1446 45%,#0c0a1d 100%);display:grid;place-items:center}
  .card{display:flex;gap:44px;align-items:center}
  .art{width:300px;height:300px;border-radius:28px;background:linear-gradient(135deg,#ff7eb3,#7b5cff 55%,#2ec5ff);box-shadow:0 30px 80px rgba(0,0,0,.5);position:relative;overflow:hidden}
  .art::before{content:"";position:absolute;left:40px;bottom:-60px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.18)}
  .art::after{content:"";position:absolute;right:46px;top:46px;width:70px;height:70px;border-radius:50%;background:#fff5c2;box-shadow:0 0 60px #fff5c2}
  h1{font-size:54px;margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
  p{margin:0;font-size:24px;color:rgba(255,255,255,.7)}
  .bars{display:flex;gap:8px;align-items:flex-end;height:120px;margin:34px 0 26px}
  .bars i{width:14px;border-radius:7px;background:linear-gradient(#2ec5ff,#ff7eb3)}
  .bar{width:460px;height:8px;border-radius:4px;background:rgba(255,255,255,.18)}
  .bar b{display:block;width:38%;height:100%;border-radius:4px;background:#fff}
  .t{display:flex;justify-content:space-between;width:460px;margin-top:10px;font-size:18px;color:rgba(255,255,255,.6)}
</style></head>
<body><!-- something colourful to show in a PiP for the screenshots workflow -->
<div class="card">
  <div class="art"></div>
  <div>
    <h1>Rainy evening</h1>
    <p>Lo-fi radio · beats to relax to</p>
    <div class="bars"></div>
    <div class="bar"><b></b></div>
    <div class="t"><span>1:24</span><span>3:42</span></div>
  </div>
</div>
<script>
  const h = [40,70,95,60,110,85,50,100,75,45,90,65,105,55,80,35,70,95,60,85];
  document.querySelector(".bars").innerHTML = h.map(v => `<i style="height:${v}px"></i>`).join("");
</script>
</body></html>
