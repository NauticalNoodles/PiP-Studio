<!doctype html>
<html><head><meta charset="utf-8"><title>Demo game</title>
<!-- for the screenshots workflow: what a full-screen game set to a narrower resolution looks like (Windows keeps its
     shape, so there are black bars at the sides). ?w=0.67 is the share of the width the game gets. -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"Segoe UI",sans-serif}
#game{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);overflow:hidden}
svg{width:100%;height:100%;display:block}
.hud{position:absolute;color:#fff;font-weight:700;text-shadow:0 2px 6px #0008}
#lap{top:4%;left:5%;font-size:3.2vh}#pos{top:4%;right:5%;font-size:3.2vh;text-align:right}
#speed{bottom:6%;right:6%;font-size:7vh;line-height:1}#speed small{font-size:2.4vh;display:block;text-align:right;opacity:.8}
</style></head>
<body><div id="game">
<svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1d4d"/><stop offset=".55" stop-color="#3a5fbf"/><stop offset="1" stop-color="#f2a65a"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a33"/><stop offset="1" stop-color="#111116"/></linearGradient>
  </defs>
  <rect width="1000" height="560" fill="url(#sky)"/>
  <path d="M0 560 L160 470 L300 520 L470 440 L640 520 L800 460 L1000 540 L1000 560Z" fill="#1d2a52"/>
  <rect y="560" width="1000" height="440" fill="#1f6b3a"/>
  <path d="M470 560 L530 560 L900 1000 L100 1000Z" fill="url(#road)"/>
  <g fill="#f5f5f5"><path d="M497 580 L503 580 L506 640 L494 640Z"/><path d="M492 690 L508 690 L514 790 L486 790Z"/><path d="M484 850 L516 850 L524 1000 L476 1000Z"/></g>
  <g fill="#d33"><path d="M380 860 L620 860 L650 960 L350 960Z"/><rect x="390" y="820" width="220" height="50" rx="12"/></g>
  <g fill="#111"><rect x="350" y="930" width="60" height="50" rx="8"/><rect x="590" y="930" width="60" height="50" rx="8"/></g>
</svg>
<div class="hud" id="lap">LAP 2/3</div><div class="hud" id="pos">POS 3/12</div>
<div class="hud" id="speed">184<small>km/h</small></div>
</div>
<script>
const share = parseFloat(new URLSearchParams(location.search).get("w") || "0.67");
function fit(){ const w = Math.round(innerWidth * share / 8) * 8; document.getElementById("game").style.width = w + "px"; }
addEventListener("resize", fit); fit();
</script>
</body></html>
