name: Feature request
description: An idea to make PiP Studio better
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would it help with?
      description: The situation where you'd use it.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Mockups, examples from other apps, screenshots.
