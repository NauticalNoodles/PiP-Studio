# Takes screenshots of PiP Studio on a Windows machine, for the README and the Microsoft Store: builds it, opens Notepad
# (something to show in a PiP), runs "PiPStudio.exe --screenshots", and keeps the pictures as a download on the run.
# With [commit screenshots] in the message (claude/ branches) it also commits them to docs/screenshots/raw.
# Runs when a commit message says [screenshots], or by hand from the Actions tab.

name: Screenshots

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet publish PiPStudio.csproj -c Release -r win-x64 --self-contained false -o out

      - name: Take screenshots
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "shots"
          New-Item -ItemType Directory -Force $dir | Out-Null
          # the machine's screen is 1024x768: make it 1080p so the window has room
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop; Write-Host "Screen set to 1920x1080" } catch { Write-Host "Couldn't change the screen size: $_" }
          # things to show in PiPs: two small local pages (a sunset, a music player) in Edge app windows
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          $prof = Join-Path $env:RUNNER_TEMP "edge"
          foreach ($page in "sunset", "radio") {
            $url = "file:///" + ((Resolve-Path ".github/screenshots/$page.html").Path -replace "\\", "/")
            Start-Process $edge -ArgumentList "--no-first-run", "--no-default-browser-check", "--user-data-dir=`"$prof`"", "--app=$url", "--window-size=1280,760"
            Start-Sleep -Seconds 4
          }
          Start-Sleep -Seconds 5
          $p = Start-Process -FilePath ".\out\PiPStudio.exe" -ArgumentList "--screenshots", "`"$dir`"" -PassThru
          Start-Sleep -Seconds 25
          # what's on the machine's screen at this point (to see a dialog in the way, if it gets stuck)
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $bmp.Save((Join-Path $dir "screen.png")); $g.Dispose(); $bmp.Dispose()
          if (-not $p.WaitForExit(150000)) { $p.Kill(); Write-Host "PiP Studio didn't finish in time" }
          $err = Join-Path $env:APPDATA "PiPStudio\errors.log"
          if (Test-Path $err) { Copy-Item $err $dir }
          Get-ChildItem $dir | Format-Table Name, Length
          $prog = Join-Path $dir "progress.txt"
          if (Test-Path $prog) { Get-Content $prog }

      # pictures named share-*.png also go into this log as text (base64), for when the run's download can't be reached
      - name: Pictures to share, as text
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem (Join-Path $env:RUNNER_TEMP "shots") -Filter "share-*.png" -ErrorAction SilentlyContinue) {
            $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes($f.FullName))
            Write-Host ("SHARE-BEGIN " + $f.Name)
            for ($i = 0; $i -lt $b.Length; $i += 3000) { Write-Host ("SHARE:" + $b.Substring($i, [Math]::Min(3000, $b.Length - $i))) }
            Write-Host "SHARE-END"
          }

      - name: Commit them to the branch (claude/ branches)
        if: startsWith(github.ref_name, 'claude/') && contains(github.event.head_commit.message, '[commit screenshots]')
        shell: pwsh
        run: |
          $raw = "docs/screenshots/raw"
          New-Item -ItemType Directory -Force $raw | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP "shots\*.png") $raw -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $raw
          git commit -m "Raw screenshots from the Screenshots workflow"
          git push origin "HEAD:${{ github.ref_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 7
