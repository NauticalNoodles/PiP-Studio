# Builds PiP Studio and attaches the downloads to a GitHub release.
#
# Runs when you publish a release on GitHub (Releases > Draft a new release > tag like v1.0.0 > Publish),
# or when you push a tag like v1.0.0. You can also run it by hand from the Actions tab (it then only
# uploads the files as a build artifact, without making a release).
#
# Each release gets:
#   PiPStudio-Setup-<version>.exe            installer (per user, no admin, includes .NET)
#   PiPStudio-<version>-win-x64-portable.zip  the same app as a single exe, no install needed
# and the matching section of CHANGELOG.md as its notes.

name: Release

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^v(\d+\.\d+\.\d+)') { $v = $Matches[1] }
          else { $v = ([xml](Get-Content PiPStudio.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1 }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Build (self-contained, single exe)
        shell: pwsh
        run: >
          dotnet publish PiPStudio.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.ver.outputs.version }} -o publish-release

      - name: Portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item LICENSE publish-release\LICENSE.txt
          Copy-Item THIRD-PARTY-NOTICES.md publish-release\
          Compress-Archive -Path publish-release\PiPStudio.exe, publish-release\LICENSE.txt, publish-release\THIRD-PARTY-NOTICES.md -DestinationPath "out\PiPStudio-$v-win-x64-portable.zip" -Force

      - name: Installer
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$v" "/DSourceDir=..\publish-release" "/DOutputDir=..\out" installer\PiPStudio.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      # Microsoft Store package. Runs once you've set the repository variables MSIX_IDENTITY_NAME, MSIX_PUBLISHER and
      # MSIX_PUBLISHER_DISPLAY_NAME (Settings > Secrets and variables > Actions > Variables) to the values Partner Center
      # shows under your app > Product management > Product identity. Not attached to the release (it's unsigned until
      # the Store signs it): download it from this run's artifacts and upload it in Partner Center.
      - name: Microsoft Store package (MSIX)
        if: vars.MSIX_IDENTITY_NAME != ''
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          dotnet publish PiPStudio.csproj -c Release -r win-x64 --self-contained true -p:Version=$v -o msix-layout
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
          Copy-Item msix\Assets msix-layout\Assets -Recurse -Force
          $m = Get-Content msix\AppxManifest.xml -Raw
          $m = $m.Replace('$IDENTITY_NAME$', '${{ vars.MSIX_IDENTITY_NAME }}')
          $m = $m.Replace('$PUBLISHER_DISPLAY_NAME$', '${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}')
          $m = $m.Replace('$PUBLISHER$', '${{ vars.MSIX_PUBLISHER }}')
          $m = $m.Replace('$VERSION$', "$v.0")                    # the Store wants x.y.z.0
          Set-Content msix-layout\AppxManifest.xml $m -Encoding utf8
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $makeappx) { throw "makeappx.exe not found" }
          & $makeappx.FullName pack /d msix-layout /p "out\PiPStudio-$v-Store.msix" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }

      - name: Keep the Store package
        if: vars.MSIX_IDENTITY_NAME != ''
        uses: actions/upload-artifact@v4
        with:
          name: PiPStudio-${{ steps.ver.outputs.version }}-Store
          path: out/*.msix

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## $([regex]::Escape($v))\b" | Select-Object -First 1).LineNumber
          if ($start) {
            $rest = $lines[$start..($lines.Length - 1)]
            # stop at the next version (## x.y.z), a top-level heading (# ...) or a --- divider
            $end = ($rest | Select-String -Pattern '^(#{1,2} |---\s*$)' | Select-Object -First 1).LineNumber
            $body = if ($end) { $rest[0..($end - 2)] } else { $rest }
          } else { $body = @("PiP Studio $v") }
          $body | Set-Content out\notes.md -Encoding utf8

      - name: Attach to the release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: PiP Studio ${{ steps.ver.outputs.version }}
          body_path: out/notes.md
          files: |
            out/PiPStudio-Setup-${{ steps.ver.outputs.version }}.exe
            out/PiPStudio-${{ steps.ver.outputs.version }}-win-x64-portable.zip

      - name: Keep the files (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PiPStudio-${{ steps.ver.outputs.version }}
          path: out/*
