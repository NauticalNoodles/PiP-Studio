// PiP Studio's phone companion as an app: it just opens the companion page PiP Studio serves on your PC.
plugins { id 'com.android.application' }

// same version as PiP Studio itself
def appVersion = (new File(rootDir, '../PiPStudio.csproj').text =~ /<Version>([^<]+)<\/Version>/)[0][1]
def keystore = System.getenv('KEYSTORE_FILE')

android {
    namespace 'io.github.nauticalnoodles.pipstudio'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.nauticalnoodles.pipstudio'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName appVersion
    }
    signingConfigs {
        // the release key from the repository's secrets (see .github/workflows/android.yml); without it, the debug key
        release {
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystore ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets { main { res.srcDirs += "$buildDir/generated/iconRes" } }
}

// the launcher icon is PiP Studio's own icon
tasks.register('copyIcon', Copy) {
    from('../../assets') { include 'icon.png'; rename { 'ic_launcher.png' } }
    into "$buildDir/generated/iconRes/mipmap-xxxhdpi"
}
preBuild.dependsOn copyIcon
